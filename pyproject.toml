[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wall-scan"
dynamic = ["version"]
description = "Discovers devices on IPv4 networks using nmap."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema>=4.26",
    "rfc3339-validator>=0.1.4",
    "pytest>=9.0",
    "ruff==0.16.10",
]

[project.scripts]
wall-scan = "wall_scan.cli:main"

[tool.hatch.version]
path = "src/wall_scan/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
